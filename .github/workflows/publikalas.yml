name: Publikálás

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-publikalas
  cancel-in-progress: false

jobs:
  publikalas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Build
        run: npm run build

      - name: Típusellenőrzés
        run: npm run check

      - name: Firebase Hosting publikálása
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RMGMERCH_23073 }}
          projectId: rmgmerch-23073
          channelId: live
          entryPoint: firebase
          firebaseToolsVersion: 14.26.0

      - name: Változtak a Firestore-szabályok?
        id: rules
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null && ! git diff --quiet HEAD~1 HEAD -- firestore.rules; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firestore-szabályok publikálása
        id: rulesdeploy
        if: steps.rules.outputs.changed == 'true'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RMGMERCH_23073 }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@14.26.0 deploy --only firestore:rules --project rmgmerch-23073 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Figyelmeztetés, ha a szabályok nem mentek fel
        if: steps.rulesdeploy.outcome == 'failure'
        run: echo "::warning title=Firestore-szabályok::A weboldal felment, de a firestore.rules publikálásához nincs jogosultsága a GitHubnak. Futtasd a helyi 'Oldal publikalasa.cmd' fájlt."

  wordpress:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      WP_ROOT: ${{ secrets.FTP_WP_ROOT }}
    defaults:
      run:
        working-directory: wordpress/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/frontend/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Típusellenőrzés
        run: npm run check

      - name: WordPress-felület buildelése
        run: npm run build

      - name: PHP szintaxis-ellenőrzés
        working-directory: wordpress
        run: find plugin theme -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Bővítmény feltöltése (wp-content/plugins/rmg-merch)
        if: env.FTP_SERVER != '' && env.WP_ROOT != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./wordpress/plugin/rmg-merch/
          server-dir: ${{ secrets.FTP_WP_ROOT }}wp-content/plugins/rmg-merch/
          state-name: .rmg-plugin-sync.json

      - name: Sablon feltöltése (wp-content/themes/rmg-merch)
        if: env.FTP_SERVER != '' && env.WP_ROOT != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./wordpress/theme/rmg-merch/
          server-dir: ${{ secrets.FTP_WP_ROOT }}wp-content/themes/rmg-merch/
          state-name: .rmg-theme-sync.json
